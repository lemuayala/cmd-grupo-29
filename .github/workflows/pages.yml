name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generar la presentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar index.html desde src/
        run: python3 src/build.py

      - name: Verificar que index.html esté al día
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html no coincide con src/. Corré 'python3 src/build.py' y commiteá el resultado."
            exit 1
          fi

      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Publicar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
